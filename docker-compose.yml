version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: nutrivida-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-nutrivida_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: nutrivida-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-nutrivida_db}?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secret}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: nutrivida-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: