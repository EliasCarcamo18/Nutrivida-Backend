services:
  backend:
    image: ${ECR_REGISTRY}/${ECR_BACKEND_REPO:-nutrivida-backend}:${IMAGE_TAG:-latest}
    container_name: nutrivida-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://${RDS_ENDPOINT}:3306/${DB_NAME:-nutrivida_db}?useSSL=true&requireSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  frontend:
    image: ${ECR_REGISTRY}/${ECR_FRONTEND_REPO:-nutrivida-frontend}:${IMAGE_TAG:-latest}
    container_name: nutrivida-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend